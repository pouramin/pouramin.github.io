<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f8ff" />
  <meta name="description" content="A browser-playable visual presentation explaining JEV, TypeSafe System One models, model routing, structured answers, and where JEV fits in AI agents." />
  <title>What Is JEV? — Visual Deck</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="deck-shell">
    <section class="deck" id="deck" aria-label="JEV visual presentation">
      <a class="language-switch" href="./fa/" lang="fa" dir="rtl" aria-label="نسخه فارسی">فارسی</a>
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <aside class="control-rail" aria-label="Presentation controls">
        <button class="rail-btn" id="prev" title="Previous slide" aria-label="Previous slide">↑</button>
        <div class="rail-count" id="counter">01<span>/06</span></div>
        <button class="rail-btn rail-btn-primary" id="play" title="Play automatically" aria-label="Play automatically">▶</button>
        <button class="rail-btn" id="next" title="Next slide" aria-label="Next slide">↓</button>
        <span class="rail-separator"></span>
        <button class="rail-btn" id="notesButton" title="Speaker notes" aria-label="Speaker notes">N</button>
        <button class="rail-btn" id="fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      </aside>

      <div class="progress-rail" id="progressRail" aria-label="Slide progress"></div>
      <div class="slide-host" id="slideHost" aria-live="polite"></div>
      <aside class="notes-panel" id="notesPanel" aria-hidden="true"></aside>
      <div class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd> Navigate <span>·</span> <kbd>F</kbd> Fullscreen <span>·</span> <kbd>N</kbd> Notes</div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
