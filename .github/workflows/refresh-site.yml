name: Refresh dynamic site data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-site.yml"
      - "scripts/update_videos.py"
      - "scripts/generate_social_preview.py"

permissions:
  contents: write

concurrency:
  group: refresh-dynamic-site-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Refresh TunnelLab videos
        run: python scripts/update_videos.py

      - name: Generate social preview
        run: python scripts/generate_social_preview.py

      - name: Commit changed generated files
        shell: bash
        run: |
          if git diff --quiet -- data/videos.json assets/social-preview.png; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json assets/social-preview.png
          git commit -m "chore: refresh dynamic site data"
          git push
