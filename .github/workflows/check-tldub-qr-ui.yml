name: check-tldub-qr-ui

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-tldub-qr-ui.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check TL-Dub QR and app JavaScript
        run: |
          node --check tldub/vendor/qrcode.js
          node --check tldub/tldub.js
