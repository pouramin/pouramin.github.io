name: check-tldub-session-ui

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-tldub-session-ui.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check TL-Dub JavaScript syntax
        run: node --check tldub/tldub.js
      - name: Verify session bootstrap is protected by Cloudflare Access
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS -D - -o /dev/null 'https://tldub-api.pouramin.dev/tldub/api/session/start?return_to=%2Ftldub%2F')"
          echo "$headers" | sed -n '1,20p'
          echo "$headers" | grep -Eiq '^location: .*cloudflareaccess\.com|^location: .*cdn-cgi/access/login'
